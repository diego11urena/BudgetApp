name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generated code (app/generated/prisma), gitignored on purpose — only
      # `npm run build` regenerates it normally, which none of these steps
      # run. Without this, every file importing the generated client fails
      # to resolve ("Cannot find module '@/app/generated/prisma/client'").
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # CI's own runner is UTC, and Vercel's production servers are too --
      # a Panama-anchored (UTC-5) date bug can hide indefinitely if nothing
      # ever runs somewhere else. TZ=America/New_York specifically (not a
      # more aggressive west-coast one): different enough from both UTC and
      # Panama to catch a local-getter bug on the modules this covers,
      # without also tripping the separate, already-cataloged, deliberately
      # deferred display-formatting issue in formatCycleRangeText (see
      # Balboa_Fix_List_1's "T4") that a bigger negative offset would.
      # Scoped to the files actually fixed for this -- lib/transaction-
      # grouping.ts has the same underlying class of bug (Panama-anchored
      # dates read via local Date getters) but hasn't been fixed yet
      # (Balboa_Fix_List_1's 1.6, remaining half); adding it to this guard
      # before fixing it would just be asserting that today's specific
      # fixtures don't happen to trip it, not that it's actually safe.
      - run: TZ=America/New_York npx vitest run lib/pay-date.test.ts lib/cycles.test.ts lib/quincena-pace.test.ts

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgetapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/budgetapp_test?schema=public
      # Only used to sign session cookies for this ephemeral CI database —
      # never a real secret, regenerated for every run's fresh Postgres
      # instance, and gitleaks-style scanners generally allow-list the
      # literal string "test" in CI-only context; still not reused anywhere.
      AUTH_SECRET: ci-only-session-secret-not-a-real-credential-32chars
      # Auth.js v5 rejects an untrusted Host header once NODE_ENV=production
      # (i.e. under `next start`, unlike the more lenient `next dev`) —
      # needed here since CI serves the app at plain localhost, not a
      # domain Auth.js already knows about. Vercel's real production
      # deployment doesn't need this (it's configured separately there);
      # this only covers the ephemeral server this workflow spins up.
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # DB-gated tests (skipIf(!DATABASE_URL) -- concurrency tests plus
      # cycles.recurring-expenses.test.ts) are skipped in the fast checks
      # job (no DATABASE_URL there) — this is the only place they actually
      # run, against a real Postgres with every migration (including the
      # race-condition unique indexes) applied. The whole suite, not a
      # named subset: naming files here previously left
      # cycles.recurring-expenses.test.ts (carry-forward/aggregate math)
      # silently skipped everywhere, in both jobs, indefinitely — the whole
      # directory means a new DB-gated test file can never fall through
      # that same gap again by omission.
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts's webServer builds + starts the app itself
      # (a real production build in CI, not the dev server) before tests run.
      - run: npm run test:e2e
      # test-results/ is where Playwright actually writes trace.zip,
      # screenshots, and error-context.md on failure (per playwright.config.ts's
      # trace/screenshot settings) regardless of which reporter is active —
      # the "github" reporter used above prints inline annotations but never
      # writes an HTML report, so playwright-report/ never exists and a prior
      # version of this step silently uploaded nothing on every failure.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
